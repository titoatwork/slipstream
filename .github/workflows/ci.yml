name: ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check slipstream tests benchmarks ci
      - name: Forbidden imports
        run: python ci/check_forbidden_imports.py
      - name: Pytest
        run: pytest
        env:
          SLIPSTREAM_DEBUG: "1"
