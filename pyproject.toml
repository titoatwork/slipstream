[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slipstream"
version = "0.0.0"
description = "A high-throughput LLM inference engine with a memory-aware scheduler."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ibtesham Ul Haque" }]
keywords = ["llm", "inference", "paged-attention", "scheduler"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyzmq>=25.0",
    "msgpack>=1.0",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
# torch/triton are required to *run* the engine (Phase 1+) but not to import
# frozen contracts. Keep them extra so Gate 0 pytest is CPU-only.
gpu = [
    "torch>=2.6",
    "triton>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
# Reference + baseline stacks. NEVER imported by slipstream/.
bench = [
    "transformers>=4.44",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/titoisalive/slipstream"

[tool.setuptools.packages.find]
include = ["slipstream*"]

[tool.setuptools.package-data]
slipstream = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["slipstream", "tests", "benchmarks", "ci"]
extend-exclude = ["dashboard", "docs/paper"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length enforced by formatter, not lint
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"slipstream/kernels/**" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["slipstream"]
exclude = ["dashboard", "benchmarks", "tests"]
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a CUDA GPU",
    "slow: long-running test",
    "parity: numerical / token identity vs HuggingFace",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
